<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0e1b">
<title>兩種做法 — Shopping Signal</title>
<meta name="description" content="Shopping Signal — 用市場訊號找出下一個可能會賣爆的商品。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0e1b'/%3E%3Cpath d='M12 42 L26 30 L38 36 L52 18' fill='none' stroke='%23ee4d2d' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
<div class="kicker">05 / 從找商品到找機會</div>
  <h2>同一件事，<span class="c">兩種做法</span></h2>
  <div class="grid g2">
    <div class="box">
      <h3 style="color:var(--tx2);letter-spacing:.06em">傳統做法</h3>
      <div class="chips" style="margin:10px 0 12px">
        <span class="chip dim">逛蝦皮</span><span class="chip dim">找商品</span><span class="chip dim">看銷量</span>
        <span class="chip dim">猜什麼會賣</span><span class="chip dim">做內容</span><span class="chip dim">放分潤連結</span>
      </div>
      <p>每一步都靠直覺，錯了要等訂單才知道。</p>
    </div>
    <div class="box win">
      <h3 style="color:var(--green);letter-spacing:.06em">Shopping Signal</h3>
      <div class="chips" style="margin:10px 0 12px">
        <span class="chip ok">市場資料</span><span class="chip ok">趨勢分析</span><span class="chip ok">AI 選品</span>
        <span class="chip ok">發現機會</span><span class="chip ok">產生內容</span><span class="chip ok">分潤變現</span>
      </div>
      <p>先有訊號，再決定投入 —— 選品變成有依據的決策。</p>
    </div>
  </div>
  </main>

  <nav class="nav">

    <span class="pageno">11 / 13</span>

  </nav>

  <script>
  /* 只是加分功能：左右方向鍵與左右滑動也能翻頁；沒有 JS 也能用按鈕翻 */
  (function(){
    try{
      var prev = 'index9.html', next = 'index11.html';
      document.addEventListener('keydown', function(e){
        if ((e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') && next) location.href = next;
        if ((e.key === 'ArrowLeft' || e.key === 'PageUp') && prev) location.href = prev;
      });
      var x0 = null;
      document.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
      document.addEventListener('touchend', function(e){
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (Math.abs(dx) < 60) return;
        if (dx < 0 && next) location.href = next;
        if (dx > 0 && prev) location.href = prev;
      }, {passive:true});
    }catch(_){}
  })();
  </script>
</body>
</html>
