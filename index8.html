<body>
  <main class="wrap">
<div class="kicker">04 / 訊號長什麼樣</div>
  <h2>例如系統發現：<b>這個品近 7 天熱度快速上升</b></h2>
  <div class="grid g2">
    <div class="box hot">
      <div class="num">TRENDING SIGNAL</div>
      <h3 style="font-size:clamp(22px,5.5vw,30px);margin-bottom:4px">折疊式隨身風扇</h3>
      <p style="margin-bottom:10px">近 7 天熱度快速上升</p>
      <div class="bignum o">↑ 42%<span class="u">7 日熱度成長（同類商品平均 +6%）</span></div>
    </div>
    <div class="rows">
      <div class="row"><span class="em">🔥</span><span class="k">Trending</span><span class="v up">↑ 42%</span></div>
      <div class="row"><span class="em">📈</span><span class="k">銷量持續成長</span><span class="v up">加速中</span></div>
      <div class="row"><span class="em">💰</span><span class="k">分潤條件良好</span><span class="v good">值得推</span></div>
      <div class="row"><span class="em">⚔️</span><span class="k">推廣競爭仍低</span><span class="v low">低</span></div>
      <div class="row"><span class="em">🎯</span><span class="k">適合短影音內容</span><span class="v fit">高契合</span></div>
    </div>
  </div>
  <p style="font-size:clamp(16px,4vw,20px)">你看到的就不再只是一堆商品，而是 —— <b class="g">現在什麼值得推。</b></p>
  </main>

  <script>
  /* 只是加分功能：左右方向鍵與左右滑動也能翻頁；沒有 JS 也能用按鈕翻 */
  (function(){
    try{
      var prev = 'index7.html', next = 'index9.html';
      document.addEventListener('keydown', function(e){
        if ((e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') && next) location.href = next;
        if ((e.key === 'ArrowLeft' || e.key === 'PageUp') && prev) location.href = prev;
      });
      var x0 = null;
      document.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
      document.addEventListener('touchend', function(e){
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (Math.abs(dx) < 60) return;
        if (dx < 0 && next) location.href = next;
        if (dx > 0 && prev) location.href = prev;
      }, {passive:true});
    }catch(_){}
  })();
  </script>
