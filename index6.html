<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0e1b">
<title>爆紅之前的黃金期 — Shopping Signal</title>
<meta name="description" content="Shopping Signal — 用市場訊號找出下一個可能會賣爆的商品。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0e1b'/%3E%3Cpath d='M12 42 L26 30 L38 36 L52 18' fill='none' stroke='%23ee4d2d' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
<div class="kicker">03 / 時機</div>
  <h2>爆紅之前，有一段<span class="g">沒人注意的黃金期</span></h2>
  <div class="stages">
    <div class="stage">
      <b>沒人討論</b><p>需求還沒成形</p>
      <div class="heat"><i style="width:12%;background:#4a5570"></i></div>
    </div>
    <div class="stage now">
      <b class="g">悄悄升溫 ← 你在這裡</b><p>熱度上升、競爭還低</p>
      <div class="heat"><i style="width:34%;background:linear-gradient(90deg,#3ddc97,#8ff0c6)"></i></div>
    </div>
    <div class="stage">
      <b style="color:var(--gold)">開始爆紅</b><p>內容紅利快速放大</p>
      <div class="heat"><i style="width:68%;background:linear-gradient(90deg,#ffc247,#ffd98a)"></i></div>
    </div>
    <div class="stage">
      <b class="o">人人都在推</b><p>只剩價格競爭</p>
      <div class="heat"><i style="width:96%;background:linear-gradient(90deg,#ee4d2d,#ff7a45)"></i></div>
    </div>
  </div>
  <p>選品的價值，不在於「現在多熱」，而在於<b>你在曲線的哪一段進場</b>。</p>
  </main>

  <nav class="nav">

    <span class="pageno">7 / 13</span>

  </nav>

  <script>
  /* 只是加分功能：左右方向鍵與左右滑動也能翻頁；沒有 JS 也能用按鈕翻 */
  (function(){
    try{
      var prev = 'index5.html', next = 'index7.html';
      document.addEventListener('keydown', function(e){
        if ((e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') && next) location.href = next;
        if ((e.key === 'ArrowLeft' || e.key === 'PageUp') && prev) location.href = prev;
      });
      var x0 = null;
      document.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
      document.addEventListener('touchend', function(e){
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (Math.abs(dx) < 60) return;
        if (dx < 0 && next) location.href = next;
        if (dx > 0 && prev) location.href = prev;
      }, {passive:true});
    }catch(_){}
  })();
  </script>
</body>
</html>
