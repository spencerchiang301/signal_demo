<meta name="description" content="Shopping Signal — 用市場訊號找出下一個可能會賣爆的商品。">

<body>
  <main class="wrap">
<div class="kicker">02 / 真正的問題</div>
  <h2>但真正困難的，不是「分享連結」</h2>
  <p class="lead">蝦皮上有<b>大量商品</b>，而且每天都在增加。</p>
  <div class="bignum">數百 · 上千<span class="u">同樣都是藍牙耳機，就有這麼多選擇</span></div>
  <div class="grid g3">
    <div class="box"><p>同樣的關鍵字，<br>每個人搜到的結果都不一樣。</p></div>
    <div class="box"><p>銷量、價格、佣金、評價，<br>隨時都在變動。</p></div>
    <div class="box"><p>你花在「挑選」的時間，<br>比做內容還多。</p></div>
  </div>
  </main>

  <nav class="nav">
    <a class="btn prev" href="index2.html">← 上一頁</a>
    <span class="pageno">4 / 14</span>
    <a class="btn next" href="index4.html">下一頁 →</a>
  </nav>

  <script>
  /* 只是加分功能：左右方向鍵與左右滑動也能翻頁；沒有 JS 也能用按鈕翻 */
  (function(){
    try{
      var prev = 'index2.html', next = 'index4.html';
      document.addEventListener('keydown', function(e){
        if ((e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') && next) location.href = next;
        if ((e.key === 'ArrowLeft' || e.key === 'PageUp') && prev) location.href = prev;
      });
      var x0 = null;
      document.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
      document.addEventListener('touchend', function(e){
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (Math.abs(dx) < 60) return;
        if (dx < 0 && next) location.href = next;
        if (dx > 0 && prev) location.href = prev;
      }, {passive:true});
    }catch(_){}
  })();
  </script>
</body>
