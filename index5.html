<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0e1b">
<title>挑賣最好的等於走進紅海 — Shopping Signal</title>
<meta name="description" content="Shopping Signal — 用市場訊號找出下一個可能會賣爆的商品。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0e1b'/%3E%3Cpath d='M12 42 L26 30 L38 36 L52 18' fill='none' stroke='%23ee4d2d' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
<div class="kicker">03 / 常見盲點</div>
  <h2>挑「目前賣最多的商品」<br>等於<span class="o">直接走進紅海</span></h2>
  <div class="grid g2">
    <div class="box">
      <h3 style="color:var(--tx2);letter-spacing:.06em">跟著排行榜走</h3>
      <div class="chips" style="margin:10px 0 12px">
        <span class="chip dim">已經很多人推</span><span class="chip dim">內容同質化</span>
        <span class="chip dim">流量成本高</span><span class="chip dim">只能拚價格</span>
      </div>
      <p>你看到它很熱的時候，競爭者早就都到了。</p>
    </div>
    <div class="box win">
      <h3 style="color:var(--green);letter-spacing:.06em">看趨勢找機會</h3>
      <div class="chips" style="margin:10px 0 12px">
        <span class="chip ok">熱度剛起</span><span class="chip ok">供給還少</span>
        <span class="chip ok">內容還沒人做</span><span class="chip ok">分潤條件好</span>
      </div>
      <p>在別人還在觀望時，你已經先卡好位置。</p>
    </div>
  </div>
  <p style="font-size:clamp(16px,4vw,20px);color:#cdd6f0">真正有價值的是：<b class="g">在商品爆起來之前，就先發現它。</b></p>
  </main>

  <nav class="nav">
    <a class="btn prev" href="index4.html">← 上一頁</a>
    <span class="pageno">6 / 14</span>
    <a class="btn next" href="index6.html">下一頁 →</a>
  </nav>

  <script>
  /* 只是加分功能：左右方向鍵與左右滑動也能翻頁；沒有 JS 也能用按鈕翻 */
  (function(){
    try{
      var prev = 'index4.html', next = 'index6.html';
      document.addEventListener('keydown', function(e){
        if ((e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') && next) location.href = next;
        if ((e.key === 'ArrowLeft' || e.key === 'PageUp') && prev) location.href = prev;
      });
      var x0 = null;
      document.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
      document.addEventListener('touchend', function(e){
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (Math.abs(dx) < 60) return;
        if (dx < 0 && next) location.href = next;
        if (dx > 0 && prev) location.href = prev;
      }, {passive:true});
    }catch(_){}
  })();
  </script>
</body>
</html>
