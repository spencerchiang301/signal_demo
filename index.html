<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0e1b">
<title>Shopping Signal — 首頁 — Shopping Signal</title>
<meta name="description" content="Shopping Signal — 用市場訊號找出下一個可能會賣爆的商品。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0e1b'/%3E%3Cpath d='M12 42 L26 30 L38 36 L52 18' fill='none' stroke='%23ee4d2d' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
<span class="badge" style="margin-bottom:6px">蝦皮分潤 × AI 選品</span>
  <h1>Shopping <span class="grad">Signal</span></h1>
  <p class="lead">不要告訴我什麼賣得最好。<br>告訴我，<b>下一個可能會賣爆的是什麼</b>。</p>
  <p class="small">市場資料 → 趨勢分析 → AI 選品　·　在商品爆起來之前，就先發現它</p>
  </main>

  <nav class="nav">
    <span class="btn prev off">← 上一頁</span>
    <span class="pageno">1 / 14</span>
    <a class="btn next" href="index1.html">下一頁 →</a>
  </nav>

  <script>
  /* 只是加分功能：左右方向鍵與左右滑動也能翻頁；沒有 JS 也能用按鈕翻 */
  (function(){
    try{
      var prev = null, next = 'index1.html';
      document.addEventListener('keydown', function(e){
        if ((e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') && next) location.href = next;
        if ((e.key === 'ArrowLeft' || e.key === 'PageUp') && prev) location.href = prev;
      });
      var x0 = null;
      document.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
      document.addEventListener('touchend', function(e){
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (Math.abs(dx) < 60) return;
        if (dx < 0 && next) location.href = next;
        if (dx > 0 && prev) location.href = prev;
      }, {passive:true});
    }catch(_){}
  })();
  </script>
</body>
</html>
