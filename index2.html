<body>
  <main class="wrap">
<div class="kicker">01 / 入場門檻</div>

  <div class="grid g4">
    <div class="box"><span class="ico">📦</span><h3>不用進貨</h3><p>沒有前期備貨資金壓力。</p></div>
    <div class="box"><span class="ico">🏬</span><h3>不用囤貨</h3><p>不用租空間、不承擔庫存風險。</p></div>
    <div class="box"><span class="ico">🚚</span><h3>不用出貨</h3><p>物流與包裝都是平台的事。</p></div>
    <div class="box"><span class="ico">💬</span><h3>不用客服</h3><p>退換貨、售後不用你出面。</p></div>
  </div>
  <div class="box win">
    <h3 style="margin-bottom:8px">你真正要做的事</h3>
    <p style="color:#d8f6ea">選對商品，然後把它變成<b>有人想看、想買的內容</b>。</p>
  </div>
  </main>

  <nav class="nav">
    <a class="btn prev" href="index1.html">← 上一頁</a>
    <span class="pageno">3 / 14</span>
    <a class="btn next" href="index3.html">下一頁 →</a>
  </nav>

  <script>
  /* 只是加分功能：左右方向鍵與左右滑動也能翻頁；沒有 JS 也能用按鈕翻 */
  (function(){
    try{
      var prev = 'index1.html', next = 'index3.html';
      document.addEventListener('keydown', function(e){
        if ((e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') && next) location.href = next;
        if ((e.key === 'ArrowLeft' || e.key === 'PageUp') && prev) location.href = prev;
      });
      var x0 = null;
      document.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
      document.addEventListener('touchend', function(e){
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (Math.abs(dx) < 60) return;
        if (dx < 0 && next) location.href = next;
        if (dx > 0 && prev) location.href = prev;
      }, {passive:true});
    }catch(_){}
  })();
  </script>
</body>
</html>
