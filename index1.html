<title>什麼是蝦皮分潤 — Shopping Signal</title>

<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
<div class="kicker">01 / 什麼是蝦皮分潤</div>
  <h2>概念其實很簡單：<span class="grad">分享，就能分潤</span></h2>
  <div class="steps">
    <div class="step"><div class="num">STEP 1</div><b>找到商品</b><p>從蝦皮海量商品中，挑出你要推的東西。</p></div>
    <div class="arw">→</div>
    <div class="step"><div class="num">STEP 2</div><b>分享商品</b><p>透過社群、短影音、網站、部落格分享出去。</p></div>
    <div class="arw">→</div>
    <div class="step"><div class="num">STEP 3</div><b>消費者購買</b><p>消費者透過你的推廣連結完成訂單。</p></div>
    <div class="arw">→</div>
    <div class="step pay"><div class="num">STEP 4</div><b class="o">獲得分潤</b><p>符合條件的訂單，就能拿到佣金。</p></div>
  </div>
  <p>你不需要自己進貨、不需要囤貨，也不需要處理出貨與客服 —— 只要<b>把好商品分享給對的人</b>。</p>
  </main>

  <script>
  /* 只是加分功能：左右方向鍵與左右滑動也能翻頁；沒有 JS 也能用按鈕翻 */
  (function(){
    try{
      var prev = 'index.html', next = 'index2.html';
      document.addEventListener('keydown', function(e){
        if ((e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') && next) location.href = next;
        if ((e.key === 'ArrowLeft' || e.key === 'PageUp') && prev) location.href = prev;
      });
      var x0 = null;
      document.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
      document.addEventListener('touchend', function(e){
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (Math.abs(dx) < 60) return;
        if (dx < 0 && next) location.href = next;
        if (dx > 0 && prev) location.href = prev;
      }, {passive:true});
    }catch(_){}
  })();
  </script>
</body>
