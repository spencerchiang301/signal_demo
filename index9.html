<body>
  <main class="wrap">
<div class="kicker">04 / 為什麼是訊號</div>
  <h2>把「靠感覺」的判斷，變成<span class="c">看得見的分數</span></h2>
  <div class="bars">
    <div class="bar"><span class="nm">🔥 搜尋 / 討論熱度</span><span class="vl o">上升中</span>
      <span class="track"><span class="fill" style="width:42%;background:linear-gradient(90deg,#ff7a45,#ee4d2d)"></span></span></div>
    <div class="bar"><span class="nm">📈 銷量成長動能</span><span class="vl c">強</span>
      <span class="track"><span class="fill" style="width:58%;background:linear-gradient(90deg,#7ee0ff,#4cc9f0)"></span></span></div>
    <div class="bar"><span class="nm">💰 分潤吸引力</span><span class="vl g">高</span>
      <span class="track"><span class="fill" style="width:74%;background:linear-gradient(90deg,#8ff0c6,#3ddc97)"></span></span></div>
    <div class="bar"><span class="nm">⚔️ 推廣競爭密度</span><span class="vl v">低</span>
      <span class="track"><span class="fill" style="width:22%;background:linear-gradient(90deg,#8b7bff,#5b4bd6)"></span></span></div>
    <div class="bar"><span class="nm">🎯 內容契合度</span><span class="vl" style="color:#ffd98a">高</span>
      <span class="track"><span class="fill" style="width:81%;background:linear-gradient(90deg,#ffd98a,#ffc247)"></span></span></div>
  </div>
  <p>五個維度交叉檢查，才能回答「<b>現在什麼值得推</b>」，而不是「什麼已經很紅」。</p>
  </main>

  <script>
  /* 只是加分功能：左右方向鍵與左右滑動也能翻頁；沒有 JS 也能用按鈕翻 */
  (function(){
    try{
      var prev = 'index8.html', next = 'index10.html';
      document.addEventListener('keydown', function(e){
        if ((e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') && next) location.href = next;
        if ((e.key === 'ArrowLeft' || e.key === 'PageUp') && prev) location.href = prev;
      });
      var x0 = null;
      document.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
      document.addEventListener('touchend', function(e){
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (Math.abs(dx) < 60) return;
        if (dx < 0 && next) location.href = next;
        if (dx > 0 && prev) location.href = prev;
      }, {passive:true});
    }catch(_){}
  })();
  </script>
