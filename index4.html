<title>到底要推哪一個 — Shopping Signal</title>
<meta name="description" content="Shopping Signal — 用市場訊號找出下一個可能會賣爆的商品。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0e1b'/%3E%3Cpath d='M12 42 L26 30 L38 36 L52 18' fill='none' stroke='%23ee4d2d' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
<div class="kicker">02 / 真正的問題</div>
  <h2>所以真正的問題是：<span class="grad">到底要推哪一個？</span></h2>
  <p>每一次選品，其實都在回答這幾個判斷題。</p>
  <div class="grid g3">
    <div class="box"><span class="ico">🔥</span><h3>哪些正在變熱門？</h3><p>最近的討論與搜尋熱度往哪走。</p></div>
    <div class="box"><span class="ico">📈</span><h3>哪些銷量在快速成長？</h3><p>不是「賣很多」，而是「正在加速」。</p></div>
    <div class="box"><span class="ico">🏷️</span><h3>哪些價格有競爭力？</h3><p>同類型商品中，值不值得被推薦。</p></div>
    <div class="box"><span class="ico">💰</span><h3>哪些佣金值得推？</h3><p>分潤條件好不好，決定投入的價值。</p></div>
    <div class="box"><span class="ico">⚔️</span><h3>哪些競爭還沒那麼激烈？</h3><p>有多少創作者已經在搶同一個品。</p></div>
    <div class="box"><span class="ico">🔎</span><h3>現在大家在搜尋什麼？</h3><p>需求正在形成，還是已經飽和。</p></div>
  </div>
  </main>

  </nav>

  <script>
  /* 只是加分功能：左右方向鍵與左右滑動也能翻頁；沒有 JS 也能用按鈕翻 */
  (function(){
    try{
      var prev = 'index3.html', next = 'index5.html';
      document.addEventListener('keydown', function(e){
        if ((e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') && next) location.href = next;
        if ((e.key === 'ArrowLeft' || e.key === 'PageUp') && prev) location.href = prev;
      });
      var x0 = null;
      document.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
      document.addEventListener('touchend', function(e){
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (Math.abs(dx) < 60) return;
        if (dx < 0 && next) location.href = next;
        if (dx > 0 && prev) location.href = prev;
      }, {passive:true});
    }catch(_){}
  })();
  </script>
