<body>
  <main class="wrap">
<div class="kicker">04 / 解法</div>

  <div class="grid g2">
    <div class="box"><span class="ico">🔍</span><h3>它不只是搜尋蝦皮商品</h3><p>如果只是把商品列出來，你還是得自己做判斷。</p></div>
    <div class="box"><span class="ico">📡</span><h3>它把資料轉換成訊號</h3><p>把大量商品資料，變成<b>可以採取行動的訊號</b>。</p></div>
  </div>
  <div class="box win">
    <div class="chips">
      <span class="chip">商品資料</span><span class="chip">趨勢變化</span><span class="chip">銷量成長</span>
      <span class="chip">價格定位</span><span class="chip">分潤條件</span><span class="chip">競爭密度</span>

  <script>
  /* 只是加分功能：左右方向鍵與左右滑動也能翻頁；沒有 JS 也能用按鈕翻 */
  (function(){
    try{
      var prev = 'index6.html', next = 'index8.html';
      document.addEventListener('keydown', function(e){
        if ((e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') && next) location.href = next;
        if ((e.key === 'ArrowLeft' || e.key === 'PageUp') && prev) location.href = prev;
      });
      var x0 = null;
      document.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
      document.addEventListener('touchend', function(e){
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (Math.abs(dx) < 60) return;
        if (dx < 0 && next) location.href = next;
        if (dx > 0 && prev) location.href = prev;
      }, {passive:true});
    }catch(_){}
  })();
  </script>
</body>
